openapi: 3.0.3
info:
  title: Umbrella E‑commerce API (Representative Contracts)
  version: 0.1.0
servers:
  - url: https://api.example.com
paths:
  /search:
    get:
      summary: Search products
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [relevance, popularity, price_asc, price_desc, newest] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        price: { type: number, format: float }
                        inStock: { type: boolean }
                        stockLabel: { type: string, example: "Out of stock" }
  /cart:
    post:
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, quantity]
              properties:
                skuId: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        '201': { description: Added }
        '409': { description: Quantity exceeds available stock }
  /checkout:
    post:
      summary: Create order (Stripe payment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress, paymentMethod]
              properties:
                shippingAddress:
                  type: object
                  properties:
                    line1: { type: string }
                    city: { type: string }
                    region: { type: string }
                    postalCode: { type: string }
                    country: { type: string }
                paymentMethod:
                  type: object
                  properties:
                    provider: { type: string, enum: [stripe] }
                    token: { type: string }
      responses:
        '201': { description: Order created; confirmation enqueued }
        '422': { description: Address validation failed (postal service mismatch) }
  /orders/{orderId}:
    get:
      summary: Get order by ID
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /orders:
    get:
      summary: List recent orders
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: email
          description: Filter by customer email (substring, case-insensitive)
          schema: { type: string }
        - in: query
          name: payment_status
          description: Filter by exact payment_status
          schema: { type: string, enum: [authorized, captured, pending, failed, refunded] }
        - in: query
          name: from
          description: Created at from (inclusive)
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: Created at to (inclusive)
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        email: { type: string }
                        shipping_address: { type: object }
                        totals_total: { type: number }
                        totals_currency: { type: string }
                        payment_status: { type: string }
                        created_at: { type: string, format: date-time }
                  limit: { type: integer }
                  offset: { type: integer }
                  filters:
                    type: object
                    properties:
                      email: { type: string, nullable: true }
                      payment_status: { type: string, nullable: true }
                      from: { type: string, format: date-time, nullable: true }
                      to: { type: string, format: date-time, nullable: true }
